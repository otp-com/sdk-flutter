name: otp_flutter
description: >-
  Phone and email verification for Flutter, over the native otp.com SDKs. Requires iOS 15 and
  Android API 26.
version: 0.3.1
homepage: https://otp.com
repository: https://github.com/otp-com/sdk-flutter
issue_tracker: https://github.com/otp-com/sdk-flutter/issues
topics:
  - otp
  - verification
  - sms
  - authentication
  - whatsapp

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.otp.sdk.flutter
        pluginClass: OtpPlugin
      ios:
        pluginClass: OtpPlugin
